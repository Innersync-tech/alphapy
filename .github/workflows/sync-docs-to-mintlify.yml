name: Request Alphapy docs pull

# Mintlify-docs pulls alphapy/docs into synced/alphapy with its own GITHUB_TOKEN.
# See Innersync-tech/mintlify-docs .github/workflows/pull-alphapy-docs.yml
#
# This job only pings that workflow so a docs/** push does not wait for the hourly
# cron. It never pushes to mintlify-docs (DOCS_SYNC_TOKEN cannot write there).
# Missing or read-only token: skip, do not fail.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch mintlify-docs pull
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No DOCS_SYNC_TOKEN. mintlify-docs pulls hourly; no instant dispatch."
            echo "Optional: PAT with Actions: Write on Innersync-tech/mintlify-docs."
            exit 0
          fi

          if gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Innersync-tech/mintlify-docs/dispatches \
            -f event_type=sync-alphapy-docs; then
            echo "Dispatched mintlify-docs pull-alphapy-docs."
            exit 0
          fi

          echo "Dispatch failed (token likely lacks Actions: Write on mintlify-docs)."
          echo "Hourly pull on mintlify-docs will still pick up docs/** changes."
          exit 0
